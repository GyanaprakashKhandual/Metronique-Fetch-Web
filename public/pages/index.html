<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Explorer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/framer-motion/11.0.8/framer-motion.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #ffffff;
            --text-primary: #24292f;
            --text-secondary: #57606a;
            --border-color: #d0d7de;
            --hover-bg: #f6f8fa;
            --accent-blue: #0969da;
            --accent-green: #1a7f37;
            --accent-orange: #bc4c00;
            --accent-red: #cf222e;
            --accent-purple: #8250df;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --hover-bg: #161b22;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-orange: #f0883e;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            transition: background 0.3s, color 0.3s;
        }

        .navbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 3px var(--shadow);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-right: 8px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .search-bar {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            pointer-events: none;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-btn {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .dropdown-btn:hover {
            background: var(--hover-bg);
            border-color: var(--text-secondary);
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 4px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 8px 24px var(--shadow);
            min-width: 180px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .dropdown-menu.active {
            display: block;
        }

        .dropdown-item {
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .dropdown-item:hover {
            background: var(--hover-bg);
        }

        .dropdown-item.active {
            background: var(--accent-blue);
            color: white;
        }

        .nav-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .nav-btn:hover {
            background: var(--hover-bg);
            border-color: var(--text-secondary);
        }

        .nav-btn.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--hover-bg);
            border-color: var(--text-secondary);
        }

        .pagination {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .page-btn {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .page-btn:hover:not(:disabled) {
            background: var(--hover-bg);
            border-color: var(--text-secondary);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .api-list {
            display: grid;
            gap: 16px;
        }

        .api-list.grid {
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        }

        .api-list.list {
            grid-template-columns: 1fr;
        }

        .api-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .api-card:hover {
            box-shadow: 0 4px 12px var(--shadow);
            transform: translateY(-2px);
        }

        .api-card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .api-icon {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 8px;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
        }

        .api-info {
            flex: 1;
        }

        .api-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .api-url {
            font-size: 13px;
            color: var(--text-secondary);
            word-break: break-all;
            font-family: 'Courier New', monospace;
        }

        .api-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .badge.GET {
            background: rgba(26, 127, 55, 0.1);
            color: var(--accent-green);
        }

        .badge.POST {
            background: rgba(9, 105, 218, 0.1);
            color: var(--accent-blue);
        }

        .badge.PUT {
            background: rgba(188, 76, 0, 0.1);
            color: var(--accent-orange);
        }

        .badge.DELETE {
            background: rgba(207, 34, 46, 0.1);
            color: var(--accent-red);
        }

        .badge.PATCH {
            background: rgba(130, 80, 223, 0.1);
            color: var(--accent-purple);
        }

        .badge.auth {
            background: rgba(9, 105, 218, 0.1);
            color: var(--accent-blue);
        }

        .badge.admin {
            background: rgba(207, 34, 46, 0.1);
            color: var(--accent-red);
        }

        .api-split {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 24px;
            height: calc(100vh - 200px);
        }

        .api-sidebar {
            overflow-y: auto;
            padding-right: 8px;
        }

        .api-detail {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            overflow-y: auto;
        }

        .detail-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .detail-section {
            margin-bottom: 24px;
        }

        .detail-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 14px;
            color: var(--text-primary);
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-family: 'Courier New', monospace;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            opacity: 0.5;
        }

        svg {
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (max-width: 768px) {
            .navbar {
                gap: 8px;
            }
            
            .search-bar {
                min-width: 100%;
                order: 10;
            }
            
            .api-split {
                grid-template-columns: 1fr;
                height: auto;
            }
        }
    </style>
</head>

                PUT: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
                DELETE: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>',
                PATCH: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
            };
            return icons[method] || icons.GET;
        }

        function loadData() {
            apiData = apiDataJson.endpoints;
            applyFilters();
        }

        function applyFilters() {
            filteredData = apiData.filter(api => {
                const matchSearch = !filters.search || 
                    api.name.toLowerCase().includes(filters.search.toLowerCase()) ||
                    api.url.toLowerCase().includes(filters.search.toLowerCase()) ||
                    api.method.toLowerCase().includes(filters.search.toLowerCase());
                
                const matchMethod = filters.method === 'all' || api.method === filters.method;
                const matchCategory = filters.category === 'all' || api.category === filters.category;
                
                return matchSearch && matchMethod && matchCategory;
            });
            
            currentPage = 0;
            renderContent();
        }

        function renderContent() {
            const content = document.getElementById('content');
            
            if (currentView === 'split') {
                renderSplitView(content);
            } else {
                renderGridOrList(content);
            }
            
            updatePaginationButtons();
        }

        function renderGridOrList(container) {
            const start = currentPage * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = filteredData.slice(start, end);
            
            if (pageData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg class="empty-icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M16 16s-1.5-2-4-2-4 2-4 2"/>
                            <line x1="9" y1="9" x2="9.01" y2="9"/>
                            <line x1="15" y1="9" x2="15.01" y2="9"/>
                        </svg>
                        <h3>No APIs Found</h3>
                        <p>Try adjusting your filters or search query</p>
                    </div>
                `;
                return;
            }
            
            const listClass = currentView === 'grid' ? 'api-list grid' : 'api-list list';
            container.innerHTML = `<div class="${listClass}" id="apiList"></div>`;
            
            const list = document.getElementById('apiList');
            pageData.forEach(api => {
                const card = createApiCard(api);
                list.appendChild(card);
            });
        }

        function renderSplitView(container) {
            const sidebarData = filteredData.slice(0, 50);
            
            container.innerHTML = `
                <div class="api-split">
                    <div class="api-sidebar" id="apiSidebar"></div>
                    <div class="api-detail" id="apiDetail">
                        <div class="empty-state">
                            <svg class="empty-icon" viewBox="0 0 24 24">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <path d="M14 2v6h6"/>
                                <path d="M16 13H8"/>
                                <path d="M16 17H8"/>
                                <path d="M10 9H8"/>
                            </svg>
                            <h3>Select an API</h3>
                            <p>Click on an API from the list to view details</p>
                        </div>
                    </div>
                </div>
            `;
            
            const sidebar = document.getElementById('apiSidebar');
            sidebarData.forEach(api => {
                const card = createApiCard(api, true);
                sidebar.appendChild(card);
            });
            
            if (selectedApi) {
                renderApiDetail(selectedApi);
            }
        }

        function createApiCard(api, isSplit = false) {
            const card = document.createElement('div');
            card.className = 'api-card';
            
            if (isSplit) {
                card.addEventListener('click', () => {
                    selectedApi = api;
                    renderApiDetail(api);
                    document.querySelectorAll('.api-sidebar .api-card').forEach(c => c.style.borderColor = 'var(--border-color)');
                    card.style.borderColor = 'var(--accent-blue)';
                });
            }
            
            const authBadge = api.authentication === 'Required' ? 
                '<span class="badge auth">Auth Required</span>' : '';
            
            const adminBadge = api.authorization !== 'None' ? 
                '<span class="badge admin">Admin</span>' : '';
            
            card.innerHTML = `
                <div class="api-card-header">
                    <div class="api-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24">
                            ${getIconForMethod(api.method)}
                        </svg>
                    </div>
                    <div class="api-info">
                        <div class="api-name">${api.name}</div>
                        <div class="api-url">${api.url}</div>
                    </div>
                </div>
                <div class="api-meta">
                    <span class="badge ${api.method}">${api.method}</span>
                    ${authBadge}
                    ${adminBadge}
                </div>
            `;
            
            return card;
        }

        function renderApiDetail(api) {
            const detail = document.getElementById('apiDetail');
            
            detail.innerHTML = `
                <div class="detail-header">
                    <div class="detail-title">${api.name}</div>
                    <div class="api-meta">
                        <span class="badge ${api.method}">${api.method}</span>
                        ${api.authentication === 'Required' ? '<span class="badge auth">Auth Required</span>' : ''}
                        ${api.authorization !== 'None' ? '<span class="badge admin">Admin</span>' : ''}
                    </div>
                </div>
                
                <div class="detail-section">
                    <div class="detail-label">Endpoint URL</div>
                    <div class="detail-value">${api.url}</div>
                </div>
                
                <div class="detail-section">
                    <div class="detail-label">Method</div>
                    <div class="detail-value">${api.method}</div>
                </div>
                
                <div class="detail-section">
                    <div class="detail-label">Authentication</div>
                    <div class="detail-value">${api.authentication}</div>
                </div>
                
                <div class="detail-section">
                    <div class="detail-label">Authorization</div>
                    <div class="detail-value">${api.authorization}</div>
                </div>
                
                <div class="detail-section">
                    <div class="detail-label">Category</div>
                    <div class="detail-value">${api.category}</div>
                </div>
            `;
        }

        function updatePaginationButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = (currentPage + 1) * itemsPerPage >= filteredData.length;
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            filters.search = e.target.value;
            applyFilters();
        });

        document.querySelectorAll('.dropdown').forEach(dropdown => {
            const btn = dropdown.querySelector('.dropdown-btn');
            const menu = dropdown.querySelector('.dropdown-menu');
            
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.dropdown-menu').forEach(m => {
                    if (m !== menu) m.classList.remove('active');
                });
                menu.classList.toggle('active');
            });
        });

        document.addEventListener('click', () => {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('active'));
        });

        document.querySelectorAll('#methodDropdown .dropdown-item').forEach(item => {
            item.addEventListener('click', () => {
                filters.method = item.dataset.method;
                applyFilters();
            });
        });

        document.querySelectorAll('#categoryDropdown .dropdown-item').forEach(item => {
            item.addEventListener('click', () => {
                filters.category = item.dataset.category;
                applyFilters();
            });
        });

        document.querySelectorAll('#viewDropdown .dropdown-item').forEach(item => {
            item.addEventListener('click', () => {
                currentView = item.dataset.view;
                renderContent();
            });
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 0) {
                currentPage--;
                renderContent();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if ((currentPage + 1) * itemsPerPage < filteredData.length) {
                currentPage++;
                renderContent();
            }
        });

        document.getElementById('themeBtn').addEventListener('click', () => {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            
            const icon = document.getElementById('themeIcon');
            if (newTheme === 'dark') {
                icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
            } else {
                icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
            }
        });

        document.getElementById('docsBtn').addEventListener('click', () => {
            alert('Documentation feature - Coming soon!');
        });

        document.getElementById('healthBtn').addEventListener('click', () => {
            alert('API Health Check - All systems operational!');
        });

        document.getElementById('privateBtn').addEventListener('click', () => {
            const btn = document.getElementById('privateBtn');
            btn.classList.toggle('active');
            if (btn.classList.contains('active')) {
                alert('Private mode enabled - Showing authenticated endpoints only');
            } else {
                alert('Private mode disabled - Showing all endpoints');
            }
        });

        loadData();
    </script>
</body>
</html>
