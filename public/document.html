<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Documentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #000000 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.03);
            border-right: 2px solid rgba(255, 255, 255, 0.1);
            padding: 30px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 0 30px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .sidebar-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .sidebar-subtitle {
            font-size: 14px;
            color: #aaaaaa;
        }

        .nav-section {
            margin-bottom: 20px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 30px;
            color: #aaaaaa;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border-left-color: rgba(255, 255, 255, 0.3);
        }

        .nav-item.active {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-left-color: #ffffff;
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .nav-text {
            font-size: 15px;
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 40px;
            max-width: 100%;
            transition: margin-left 0.3s ease;
        }

        .content-header {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .content-title {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .content-description {
            font-size: 18px;
            color: #aaaaaa;
        }

        .markdown-body {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            line-height: 1.8;
        }

        .markdown-body h1 {
            font-size: 36px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .markdown-body h2 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 40px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .markdown-body h3 {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            margin-top: 30px;
            margin-bottom: 12px;
        }

        .markdown-body h4 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            margin-top: 24px;
            margin-bottom: 10px;
        }

        .markdown-body p {
            margin-bottom: 16px;
            color: #cccccc;
        }

        .markdown-body ul,
        .markdown-body ol {
            margin-bottom: 16px;
            padding-left: 30px;
        }

        .markdown-body li {
            margin-bottom: 8px;
            color: #cccccc;
        }

        .markdown-body code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            color: #00ff00;
        }

        .markdown-body pre {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
            margin-bottom: 16px;
        }

        .markdown-body pre code {
            background: none;
            padding: 0;
            color: #00ff00;
        }

        .markdown-body blockquote {
            border-left: 4px solid rgba(255, 255, 255, 0.3);
            padding-left: 20px;
            margin: 16px 0;
            color: #aaaaaa;
            font-style: italic;
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
        }

        .markdown-body table th,
        .markdown-body table td {
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            text-align: left;
        }

        .markdown-body table th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
            color: #ffffff;
        }

        .markdown-body table td {
            color: #cccccc;
        }

        .markdown-body a {
            color: #667eea;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s ease;
        }

        .markdown-body a:hover {
            border-bottom-color: #667eea;
        }

        .markdown-body hr {
            border: none;
            border-top: 2px solid rgba(255, 255, 255, 0.1);
            margin: 30px 0;
        }

        .markdown-body img {
            max-width: 100%;
            border-radius: 8px;
            margin: 16px 0;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00ff00;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid rgba(255, 0, 0, 0.3);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
        }

        .error-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            stroke: #ff0000;
        }

        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .error-text {
            color: #aaaaaa;
            font-size: 16px;
        }

        .mobile-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mobile-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .mobile-toggle svg {
            width: 24px;
            height: 24px;
            stroke: #ffffff;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .sidebar-overlay.active {
                display: block;
            }

            .main-content {
                margin-left: 0;
                padding: 80px 20px 40px;
            }

            .mobile-toggle {
                display: block;
            }

            .content-title {
                font-size: 32px;
            }

            .markdown-body {
                padding: 24px;
            }

            .markdown-body h1 {
                font-size: 28px;
            }

            .markdown-body h2 {
                font-size: 22px;
            }

            .markdown-body h3 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="mobile-toggle" onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Documentation</div>
                <div class="sidebar-subtitle">API Reference Guide</div>
            </div>

            <nav class="nav-section">
                <div class="nav-item" data-doc="user">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <span class="nav-text">User</span>
                </div>

                <div class="nav-item" data-doc="team">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                    <span class="nav-text">Team</span>
                </div>

                <div class="nav-item" data-doc="project">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                    </svg>
                    <span class="nav-text">Project</span>
                </div>

                <div class="nav-item" data-doc="repository">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" />
                    </svg>
                    <span class="nav-text">Repository</span>
                </div>

                <div class="nav-item" data-doc="database">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <ellipse cx="12" cy="5" rx="9" ry="3" />
                        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
                        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
                    </svg>
                    <span class="nav-text">Database</span>
                </div>

                <div class="nav-item" data-doc="services">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="8" rx="2" ry="2" />
                        <rect x="2" y="14" width="20" height="8" rx="2" ry="2" />
                        <line x1="6" y1="6" x2="6.01" y2="6" />
                        <line x1="6" y1="18" x2="6.01" y2="18" />
                    </svg>
                    <span class="nav-text">Services</span>
                </div>

                <div class="nav-item" data-doc="comment">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    <span class="nav-text">Comment</span>
                </div>

                <div class="nav-item" data-doc="audit">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                        <polyline points="10 9 9 9 8 9" />
                    </svg>
                    <span class="nav-text">Audit</span>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <div class="content-header">
                <h1 class="content-title" id="contentTitle">User Documentation</h1>
                <p class="content-description" id="contentDescription">Complete API reference and usage guide</p>
            </div>

            <div id="markdownContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="color: #aaaaaa;">Loading documentation...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script>
        const docTitles = {
            user: 'User Documentation',
            team: 'Team Documentation',
            project: 'Project Documentation',
            repository: 'Repository Documentation',
            database: 'Database Documentation',
            services: 'Services Documentation',
            comment: 'Comment Documentation',
            audit: 'Audit Documentation'
        };

        const docDescriptions = {
            user: 'User management and authentication API reference',
            team: 'Team collaboration and management endpoints',
            project: 'Project creation, management, and configuration',
            repository: 'Repository handling and version control',
            database: 'Database operations and query management',
            services: 'Microservices architecture and API integration',
            comment: 'Comment system and moderation features',
            audit: 'Audit logs and activity tracking system'
        };

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        async function loadDoc(docName) {
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));
            
            const activeItem = document.querySelector(`[data-doc="${docName}"]`);
            if (activeItem) {
                activeItem.classList.add('active');
            }

            document.getElementById('contentTitle').textContent = docTitles[docName];
            document.getElementById('contentDescription').textContent = docDescriptions[docName];

            const content = document.getElementById('markdownContent');
            content.innerHTML = '<div class="loading"><div class="spinner"></div><p style="color: #aaaaaa;">Loading documentation...</p></div>';

            // Try multiple possible paths
            const possiblePaths = [
                `../docs/${docName}.doc.md`,  // From public/ to docs/
            ];

            let markdown = null;
            let successPath = null;

            for (const path of possiblePaths) {
                try {
                    const response = await fetch(path);
                    if (response.ok) {
                        markdown = await response.text();
                        successPath = path;
                        break;
                    }
                } catch (error) {
                    continue;
                }
            }

            if (markdown) {
                try {
                    const html = marked.parse(markdown);
                    content.innerHTML = `<div class="markdown-body">${html}</div>`;
                } catch (error) {
                    console.error('Error parsing markdown:', error);
                    showError(content, docName, 'Error parsing markdown content');
                }
            } else {
                showError(content, docName, 'File not found in any expected location');
            }

            if (window.innerWidth <= 768) {
                toggleSidebar();
            }
        }

        function showError(content, docName, reason) {
            content.innerHTML = `
                <div class="error-message">
                    <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                    <div class="error-title">Documentation Not Found</div>
                    <div class="error-text">
                        The documentation file "${docName}.doc.md" could not be loaded.<br>
                        ${reason}<br><br>
                        <strong>Expected file structure:</strong><br>
                        - public/document.html (this file)<br>
                        - docs/${docName}.doc.md<br><br>
                        Or move the docs folder inside the public folder.
                    </div>
                </div>
            `;
        }

        // Add click event listeners to all nav items
        document.addEventListener('DOMContentLoaded', () => {
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    const docName = item.getAttribute('data-doc');
                    loadDoc(docName);
                });
            });

            // Auto-load user documentation on page load
            loadDoc('user');
        });
    </script>
</body>

</html>
